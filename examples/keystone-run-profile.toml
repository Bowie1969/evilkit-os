# EvilKit run profile — Keystone, full range
#
# Copy this next to your engagement and pass it at launch:
#
#   evilkimi --run-profile examples/keystone-run-profile.toml
#
# Everything in the profile is fixed for the run, and preflight fails the launch
# when one of them does not resolve — a missing tool, an absent credential, a
# scope that disagrees, or a dashboard run whose topology cannot place the entry
# host. A profile that cannot run must stop the launch, not a turn three hours in.

name = "keystone-full"

# The run's authorised targets. The launch scope must match this exactly: two runs
# only compare on the same scope.
scope = "10.99.50.0/24,10.50.0.0/24"

# Where the operator launches from. Traffic that does not source from here is not
# recorded as range evidence, and the dashboard run's topology must contain it.
entry_host = "10.99.50.60"

# Servers that must be declared for the Kimi CLI, and the tools this run depends
# on. A tool the server does not advertise fails preflight instead of becoming a
# deferred-tool refusal mid-run.
required_servers = ["pentest", "mission", "redteamscripting"]
# "server:tool" pins the requirement to the server that has to provide it — the
# only form that can be checked when a server launches somewhere else (the pentest
# MCP is reached over ssh, so its schema cannot be read from here; a bare tool name
# is then reported as unconfirmed rather than missing).
required_tools = [
    "pentest:nmap_scan",
    "pentest:verify_http",
    "pentest:credential_spray",
    "pentest:netexec",
    "pentest:ssh_tunnel",
    "redteamscripting:malware_harvest",
    "redteamscripting:malware_generate",
    "redteamscripting:malware_deploy",
    "redteamscripting:malware_test",
    "redteamscripting:malware_persist",
    "redteamscripting:malware_c2",
]

# The malware tools refuse to act without guest credentials, so the launcher has
# to supply them ([lab_ssh] in ~/.config/evilkit/config.toml, or LAB_SSH_* in the
# environment). Unresolved credentials fail the launch.
requires_lab_ssh = true

# Prepared dashboard run. Its dashboard/topology.json must contain entry_host,
# or every emitted event is dropped silently.
dashboard_run_dir = "~/Projects/keystone-range/runs/<run-id>"

# Optional: where the harness trace and the preflight report should be written.
# trace_path = "~/.local/state/evilkimi/runs/keystone-full.trace.jsonl"

# What the run is trying to prove. These names are the mission contract's
# objective ids, so the operator and the contract agree on the vocabulary.
objectives = ["delivery", "persistence", "c2_resilience", "propagation", "crown_objective"]

# The topology this run actually knows. Everything not listed here is UNKNOWN to
# the operator and has to be discovered — the doctrine no longer carries a range
# layout of its own, because a stale one reached the operator in Run 1.
topology = """
DMZ        10.99.50.0/24 — 16 live hosts. Entry/launch origin .60. Known services
           on .11 (Staff Portal :8080), .21 (relay), .31, .41 (files/SMB),
           .51 (MySQL), .61 (DC01, AD), .81 (web).
CORP       10.50.0.0/24 — behind a pivot from the DMZ. Reachability from the DMZ
           is UNVERIFIED; the last two runs saw it time out rather than refuse.
Crown      behind CORP. Not directly reachable from the DMZ as far as this profile
           knows — probe for it rather than assuming a route.
Routing    Traffic from the operator's origin is picked up by the range telemetry
           only when it sources from .60; pivot through a foothold.
"""
